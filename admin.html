<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم شركة آرتيزان للتشطيبات | Artisan Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Cairo', sans-serif; }</style>
  <script src="config.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="login-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-sm w-full text-center space-y-6 shadow-2xl">
      <div class="w-16 h-16 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto">
        <i data-lucide="lock" class="w-8 h-8"></i>
      </div>
      <div>
        <h2 class="text-xl font-black text-white">إدارة شركة آرتيزان</h2>
        <p class="text-xs text-slate-400 mt-1">أدخل الرمز السري للوحة التحكم</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <input type="password" id="pin-input" placeholder="الرمز السري (decor2026)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-lg text-amber-400 font-bold focus:ring-2 focus:ring-amber-500 focus:outline-none">
        
        <div id="lockout-msg" class="hidden text-xs text-rose-400 font-bold bg-rose-500/10 p-2.5 rounded-xl border border-rose-500/20">
          تم قفل الإدخال مؤقتاً لتكرار المحاولات الخاطئة. انتظر <span id="lockout-timer">30</span> ثانية.
        </div>

        <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black py-3 rounded-xl transition-all shadow-lg">
          تسجيل الدخول
        </button>
      </form>
      <div class="text-[11px] text-slate-500">
        الرمز الافتراضي للتجربة: <code class="text-amber-400 font-bold">decor2026</code>
      </div>
    </div>
  </div>

  <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-bold">
          <i data-lucide="compass" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-base font-black text-white">إدارة آرتيزان للتشطيبات</h1>
          <span class="text-xs text-amber-400 font-semibold">تعديل أسعار الباقات والواتساب</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <a href="/" target="_blank" class="text-xs bg-slate-800 text-slate-200 px-3.5 py-2 rounded-xl flex items-center gap-1.5">
          <i data-lucide="external-link" class="w-4 h-4"></i>
          <span>الموقع لايف</span>
        </a>
        <button onclick="logout()" class="text-xs text-rose-400 font-bold">خروج</button>
      </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-8 space-y-6">
      <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-800 space-y-6">
        <h2 class="text-lg font-black text-white">بيانات الشركة وأسعار المتر للباقات</h2>
        
        <form id="settings-form" onsubmit="handleSave(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">اسم الشركة:</label>
              <input type="text" data-config-field="companyNameAr" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">رقم واتساب المعاينات (بكود الدولة):</label>
              <input type="text" data-config-field="whatsappNumber" placeholder="مثال: 201000000000" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-emerald-400 focus:ring-2 focus:ring-amber-500 focus:outline-none" dir="ltr">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">رقم الاتصال المعروض (Display Phone):</label>
              <input type="text" data-config-field="phoneDisplay" placeholder="مثال: 01000000000" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-amber-400 focus:ring-2 focus:ring-amber-500 focus:outline-none" dir="ltr">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 border-t border-slate-800 pt-4">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">سعر متر سوبر لوكس (ج):</label>
              <input type="number" data-config-field="packages.0.pricePerMeter" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-amber-400 focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">سعر متر ألترا لوكس (ج):</label>
              <input type="number" data-config-field="packages.1.pricePerMeter" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-amber-400 focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">سعر متر VIP الفندقية (ج):</label>
              <input type="number" data-config-field="packages.2.pricePerMeter" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-amber-400 focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>
          </div>

          <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black py-3.5 rounded-xl transition-all shadow-lg hover:opacity-95">
            حفظ التعديلات فوراً
          </button>
        </form>
      </div>
    </main>
  </div>

  <script>
    let currentCfg = window.InteriorConfig;
    let failedAttempts = 0;
    let isLockedOut = false;

    function handleLogin(e) {
      e.preventDefault();
      if (isLockedOut) return;

      if (document.getElementById("pin-input").value.trim() === window.AppConfig.data.adminPin) {
        failedAttempts = 0;
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("admin-dashboard").classList.remove("hidden");
        initDashboard();
      } else {
        failedAttempts++;
        if (failedAttempts >= 5) {
          triggerLockout();
        } else {
          alert(`الرمز السري غير صحيح! المتبقي: ${5 - failedAttempts} محاولات.`);
        }
      }
    }

    function triggerLockout() {
      isLockedOut = true;
      let remaining = 30;
      const lockoutMsg = document.getElementById("lockout-msg");
      const lockoutTimer = document.getElementById("lockout-timer");
      const loginBtn = document.getElementById("login-btn");
      const pinInput = document.getElementById("pin-input");

      lockoutMsg.classList.remove("hidden");
      loginBtn.disabled = true;
      loginBtn.classList.add("opacity-50", "cursor-not-allowed");
      pinInput.disabled = true;

      const interval = setInterval(() => {
        remaining--;
        lockoutTimer.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(interval);
          isLockedOut = false;
          failedAttempts = 0;
          lockoutMsg.classList.add("hidden");
          loginBtn.disabled = false;
          loginBtn.classList.remove("opacity-50", "cursor-not-allowed");
          pinInput.disabled = false;
          pinInput.value = "";
        }
      }, 1000);
    }

    function logout() {
      document.getElementById("admin-dashboard").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("pin-input").value = "";
    }

    function initDashboard() {
      window.AppConfig.populateForm("#settings-form");
      lucide.createIcons();
    }

    function handleSave(e) {
      e.preventDefault();
      const updated = window.AppConfig.extractFormData("#settings-form");

      if (window.AppConfig.save(updated)) {
        alert("✅ تم حفظ التعديلات بنجاح وستظهر في الموقع فوراً!");
        initDashboard();
      } else {
        alert("❌ حدث خطأ أثناء الحفظ!");
      }
    }
  </script>
</body>
</html>
