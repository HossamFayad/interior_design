<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم شركة آرتيزان للتشطيبات | Artisan Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Cairo', sans-serif; }</style>
  <script src="config.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="login-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-sm w-full text-center space-y-6 shadow-2xl">
      <div class="w-16 h-16 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto">
        <i data-lucide="lock" class="w-8 h-8"></i>
      </div>
      <div>
        <h2 class="text-xl font-black text-white">إدارة شركة آرتيزان</h2>
        <p class="text-xs text-slate-400 mt-1">أدخل الرمز السري للوحة التحكم</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <input type="password" id="pin-input" placeholder="الرمز السري (decor2026)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-lg text-amber-400 font-bold focus:ring-2 focus:ring-amber-500 focus:outline-none">
        <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black py-3 rounded-xl transition-all shadow-lg">
          دخول
        </button>
      </form>
    </div>
  </div>

  <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-bold">
          <i data-lucide="compass" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-base font-black text-white">إدارة آرتيزان للتشطيبات</h1>
          <span class="text-xs text-amber-400 font-semibold">تعديل أسعار الباقات والواتساب</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <a href="/" target="_blank" class="text-xs bg-slate-800 text-slate-200 px-3.5 py-2 rounded-xl flex items-center gap-1.5">
          <i data-lucide="external-link" class="w-4 h-4"></i>
          <span>الموقع لايف</span>
        </a>
        <button onclick="logout()" class="text-xs text-rose-400 font-bold">خروج</button>
      </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-8 space-y-6">
      <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-800 space-y-6">
        <h2 class="text-lg font-black text-white">بيانات الشركة وأسعار المتر</h2>
        
        <form onsubmit="handleSave(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">اسم الشركة:</label>
              <input type="text" id="cfg-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">رقم واتساب المعاينات:</label>
              <input type="text" id="cfg-whatsapp" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-emerald-400" dir="ltr">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 border-t border-slate-800 pt-4">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">سعر متر سوبر لوكس (ج):</label>
              <input type="number" id="pkg-price-0" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-amber-400">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">سعر متر ألترا لوكس (ج):</label>
              <input type="number" id="pkg-price-1" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-amber-400">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">سعر متر VIP الفندقية (ج):</label>
              <input type="number" id="pkg-price-2" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-amber-400">
            </div>
          </div>

          <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black py-3.5 rounded-xl">
            حفظ التعديلات فوراً
          </button>
        </form>
      </div>
    </main>
  </div>

  <script>
    let currentCfg = window.InteriorConfig;

    function handleLogin(e) {
      e.preventDefault();
      if (document.getElementById("pin-input").value.trim() === currentCfg.adminPin) {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("admin-dashboard").classList.remove("hidden");
        initDashboard();
      } else {
        alert("الرمز السري غير صحيح!");
      }
    }

    function logout() {
      document.getElementById("admin-dashboard").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
    }

    function initDashboard() {
      document.getElementById("cfg-name").value = currentCfg.companyNameAr;
      document.getElementById("cfg-whatsapp").value = currentCfg.whatsappNumber;
      document.getElementById("pkg-price-0").value = currentCfg.packages[0].pricePerMeter;
      document.getElementById("pkg-price-1").value = currentCfg.packages[1].pricePerMeter;
      document.getElementById("pkg-price-2").value = currentCfg.packages[2].pricePerMeter;
      lucide.createIcons();
    }

    function handleSave(e) {
      e.preventDefault();
      currentCfg.companyNameAr = document.getElementById("cfg-name").value.trim();
      currentCfg.whatsappNumber = document.getElementById("cfg-whatsapp").value.trim();
      currentCfg.packages[0].pricePerMeter = parseInt(document.getElementById("pkg-price-0").value);
      currentCfg.packages[1].pricePerMeter = parseInt(document.getElementById("pkg-price-1").value);
      currentCfg.packages[2].pricePerMeter = parseInt(document.getElementById("pkg-price-2").value);

      if (window.saveInteriorConfig(currentCfg)) {
        alert("✅ تم حفظ التعديلات بنجاح!");
      }
    }
  </script>
</body>
</html>
